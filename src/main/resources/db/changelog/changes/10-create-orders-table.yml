databaseChangeLog:
  - changeSet:
      id: create-orders-table
      author: lora_nazarenko
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: orders
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: status
                  type: enum('COMPLETED', 'PENDING', 'DELIVERED')
                  constraints:
                    nullable: true
              - column:
                  name: total
                  type: decimal(10, 2)
                  constraints:
                    nullable: true
              - column:
                  name: order_date
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: shipping_address
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: is_deleted
                  type: bit
                  constraints:
                    nullable: false
