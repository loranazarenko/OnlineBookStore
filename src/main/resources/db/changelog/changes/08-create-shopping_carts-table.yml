databaseChangeLog:
  - changeSet:
      id: create-shopping_carts-table
      author: lora_nazarenko
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: shopping_carts
      changes:
        - createTable:
            tableName: shopping_carts
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
              - column:
                  name: is_deleted
                  type: bit
                  constraints:
                    nullable: false
