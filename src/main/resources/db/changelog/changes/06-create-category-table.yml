databaseChangeLog:
  - changeSet:
      id: create-role-table
      author: lora_nazarenko
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: categories
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
              - column:
                  name: is_deleted
                  type: bit
                  constraints:
                    nullable: false
